[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pkgwho"
dynamic = ["version"]
description = "Identify the packages that provide commands and fonts on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = ["package manager", "package ownership", "command", "font", "linux"]
authors = [
  { name = "Toshihiro Kamiya", email = "kamiya@mbj.nifty.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: System :: Installation/Setup",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.0.0", "pytest>=7"]

[project.scripts]
pkgwho = "pkgwho.cli:main"

[project.urls]
Documentation = "https://github.com/tos-kamiya/pkgwho#readme"
Issues = "https://github.com/tos-kamiya/pkgwho/issues"
Source = "https://github.com/tos-kamiya/pkgwho"
Changelog = "https://github.com/tos-kamiya/pkgwho/blob/main/release-notes.md"

[tool.hatch.version]
path = "src/pkgwho/__about__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/dev-notes"]

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/pkgwho tests}"

[tool.mypy]
python_version = "3.10"
files = ["src/pkgwho"]

[tool.coverage.run]
source_pkgs = ["pkgwho", "tests"]
branch = true
parallel = true
omit = [
  "src/pkgwho/__about__.py",
]

[tool.coverage.paths]
pkgwho = ["src/pkgwho", "*/pkgwho/src/pkgwho"]
tests = ["tests", "*/pkgwho/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
